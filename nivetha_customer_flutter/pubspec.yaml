name: nivetha_customer_flutter
description: "Nivetha Catering Customer Mobile Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  provider: ^6.1.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/Nivetha Catering Service Emblem.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Nivetha Catering Service Emblem.png"
  min_sdk_android: 21