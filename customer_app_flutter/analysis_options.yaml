# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
  errors:
    # Treat missing required parameters as a warning
    missing_required_param: warning
    # Treat missing returns as a warning
    missing_return: warning
    # Ignore deprecation warnings during quick builds if needed
    deprecated_member_use: info
    prefer_single_quotes: ignore
    prefer_const_constructors: ignore
    always_declare_return_types: ignore
    prefer_typing_uninitialized_variables: ignore

linter:
  rules:
    # Prefer const constructors for improved Flutter performance
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_constructors_in_immutables: true

    # Clean code formatting and best practices
    avoid_print: true
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_empty_else: true
    cancel_subscriptions: true
    close_sinks: true